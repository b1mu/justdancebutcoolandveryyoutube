<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Papa's Pizzeria</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#171321;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#game{width:min(100vw,133.333vh);height:min(75vw,100vh);aspect-ratio:4/3}
ruffle-player{display:block;width:100%;height:100%}
</style>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay: "on",
  unmuteOverlay: "hidden",
  letterbox: "on",
  warnOnUnsupportedContent: false,
  backgroundColor: "#171321",
  scale: "showAll"
};
</script>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
<div id="game">
  <embed src="./papas-pizzeria.swf" width="100%" height="100%" type="application/x-shockwave-flash">
</div>
</body>
</html>
