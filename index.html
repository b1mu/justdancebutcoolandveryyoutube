<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#171321">
<title>Papa's Pizzeria</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171321}
body{display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}
#game{width:min(100vw, calc(100vh * 1.3333));height:min(100vh, calc(100vw * .75));aspect-ratio:4/3;display:block}
ruffle-player{width:100%;height:100%;display:block}
#hint{position:fixed;left:0;right:0;bottom:8px;text-align:center;color:#aaa;font-size:11px;pointer-events:none}
@media(orientation:portrait){#game{width:100vw;height:auto;max-height:100vh} }
</style>
</head>
<body>
<div id="game"></div>
<script src="ruffle/ruffle.js"></script>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay: "on",
  unmuteOverlay: "hidden",
  letterbox: "on",
  warnOnUnsupportedContent: false,
  contextMenu: "on",
  backgroundColor: "#171321",
  showSwfDownload: false,
  allowScriptAccess: true,
  scale: "showAll"
};
const ruffle = window.RufflePlayer.newest();
const player = ruffle.createPlayer();
player.style.width = "100%";
player.style.height = "100%";
document.getElementById("game").appendChild(player);
player.load("papas-pizzeria.swf").catch(err => {
  document.getElementById("game").textContent = "Could not load Papa's Pizzeria: " + err;
});
</script>
</body>
</html>
