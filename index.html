<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Papa's Pizzeria</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#171321;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#game{width:min(100vw,133.333vh);height:min(75vw,100vh);aspect-ratio:4/3}
ruffle-player{display:block;width:100%;height:100%}
#error{display:none;color:white;font:16px Arial,sans-serif;padding:20px;text-align:center}
</style>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay: "on",
  unmuteOverlay: "hidden",
  letterbox: "on",
  warnOnUnsupportedContent: false,
  backgroundColor: "#171321",
  scale: "showAll"
};
</script>
<script src="./ruffle/ruffle.js"></script>
</head>
<body>
<div id="game"></div>
<div id="error"></div>
<script>
window.addEventListener("DOMContentLoaded", async () => {
  const box = document.getElementById("game");
  const error = document.getElementById("error");
  try {
    if (!window.RufflePlayer || !window.RufflePlayer.newest) {
      throw new Error("Ruffle did not load. Check that the ruffle folder is beside index.html.");
    }
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    player.style.width = "100%";
    player.style.height = "100%";
    box.appendChild(player);
    await player.ruffle().load("./papas-pizzeria.swf");
  } catch (e) {
    box.style.display = "none";
    error.style.display = "block";
    error.textContent = "Game could not start: " + (e && e.message ? e.message : e);
  }
});
</script>
</body>
</html>
