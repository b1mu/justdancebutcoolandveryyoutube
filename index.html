<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flipline Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#39275d,#171323 65%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{text-align:center;padding:30px 16px 18px}h1{margin:0;font-size:clamp(2rem,7vw,3.5rem);letter-spacing:-2px}header p{margin:8px 0 0;color:#cfc5e8}.games{width:min(1050px,94%);margin:20px auto 50px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.game{background:#29213c;border:1px solid #594779;border-radius:18px;padding:20px;text-align:left;color:white;cursor:pointer;min-height:125px;transition:.15s}.game:hover{transform:translateY(-4px);background:#392b52;border-color:#b99cff}.game b{display:block;font-size:1.15rem}.game small{display:block;color:#c9bddf;margin-top:8px}.tag{display:inline-block;margin-top:12px;background:#6546a0;border-radius:20px;padding:4px 9px;font-size:.72rem}#playerScreen{display:none;position:fixed;inset:0;background:#100d18;flex-direction:column}#top{height:54px;display:flex;align-items:center;gap:14px;padding:8px 12px;background:#211a30}#back{border:0;border-radius:10px;padding:9px 14px;background:#7654ad;color:white;font-weight:700}#gameTitle{font-weight:700}#game{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}ruffle-player{width:min(100%,133.333vh);height:min(100%,75vw);aspect-ratio:4/3;background:#000}
</style>
<script>window.RufflePlayer=window.RufflePlayer||{};window.RufflePlayer.config={autoplay:"on",unmuteOverlay:"hidden",letterbox:"on",warnOnUnsupportedContent:false,backgroundColor:"#171321",scale:"showAll"};</script>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
<header><h1>Flipline Arcade</h1><p>Pick a game and play right in your browser.</p></header>
<main class="games" id="games"></main>
<section id="playerScreen"><div id="top"><button id="back" onclick="backToMenu()">← Games</button><span id="gameTitle"></span></div><div id="game"></div></section>
<script>
const titles=[
 ['Papa’s Pizzeria','papas-pizzeria.swf','Pizza shop'],['Papa’s Wingeria','papaswingeria.swf','Wing restaurant'],['Papa’s Bakeria','papasbakeria.swf','Pie shop'],['Papa’s Cheeseria','papascheeseria.swf','Grilled cheese'],['Papa’s Donuteria','papasdonuteria.swf','Donut shop'],['Papa’s Hot Doggeria','papashotdoggeria.swf','Hot dogs'],['Papa’s Pastaria','papaspastaria.swf','Pasta restaurant'],['Papa’s Scooperia','papasscooperia.swf','Ice cream cookies'],['Papa’s Sushiria','papassushiria.swf','Sushi restaurant']
];
const list=document.getElementById('games');
titles.forEach(([name,file,desc])=>{const b=document.createElement('button');b.className='game';b.innerHTML=`<b>${name}</b><small>${desc}</small><span class="tag">PLAY NOW</span>`;b.onclick=()=>play(name,file);list.appendChild(b)});
function play(name,file){document.querySelector('header').style.display='none';list.style.display='none';document.getElementById('playerScreen').style.display='flex';document.getElementById('gameTitle').textContent=name;const host=document.getElementById('game');host.innerHTML='';const ruffle=window.RufflePlayer.newest();const player=ruffle.createPlayer();host.appendChild(player);player.load('./'+file).catch(e=>{host.innerHTML='<p>Could not load this game. Check that the SWF file is in the same folder as index.html.</p>';console.error(e)})}
function backToMenu(){const host=document.getElementById('game');host.innerHTML='';document.getElementById('playerScreen').style.display='none';document.querySelector('header').style.display='block';list.style.display='grid'}
</script>
</body></html>
